<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能研究助手</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --user-bg: #007aff;
            --user-text: #ffffff;
            --assistant-bg: #ffffff;
            --assistant-text: #1d1d1f;
            --border: #e5e5e7;
            --primary: #007aff;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--assistant-text);
        }

        header .subtitle {
            font-size: 12px;
            color: #86868b;
            margin-top: 2px;
        }

        button#reset-btn {
            padding: 6px 14px;
            font-size: 13px;
            color: var(--primary);
            background: rgba(0, 122, 255, 0.08);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button#reset-btn:hover {
            background: rgba(0, 122, 255, 0.15);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            line-height: 1.6;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            color: white;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.user .avatar {
            background: var(--user-bg);
        }

        .message.assistant .avatar {
            background: #34c759;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: var(--shadow);
        }

        .message.user .bubble {
            background: var(--user-bg);
            color: var(--user-text);
            border-top-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: var(--assistant-bg);
            color: var(--assistant-text);
            border-top-left-radius: 4px;
        }

        .bubble.error {
            background: #fff3f3 !important;
            color: #c0392b !important;
            border: 1px solid #fadbd8;
        }

        .bubble.thinking::after {
            content: '▋';
            animation: blink 0.8s infinite;
            color: var(--primary);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        footer {
            background: #ffffff;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
        }

        .input-row {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            resize: none;
            max-height: 140px;
            min-height: 42px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        #input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            padding: 0 18px;
            height: 42px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        #send-btn:hover:not(:disabled) {
            background: #0066d6;
        }

        #send-btn:disabled {
            background: #b8d4f8;
            cursor: not-allowed;
        }

        .empty-hint {
            max-width: 760px;
            margin: auto;
            text-align: center;
            color: #86868b;
            font-size: 14px;
            padding: 40px 20px;
        }

        .empty-hint h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--assistant-text);
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .examples button {
            padding: 6px 12px;
            font-size: 13px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            color: var(--primary);
            transition: background 0.15s;
        }

        .examples button:hover {
            background: rgba(0, 122, 255, 0.06);
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>智能研究助手</h1>
            <div class="subtitle">基于 LangChain + LangGraph · 支持联网搜索与天气查询</div>
        </div>
        <button id="reset-btn">清空记忆</button>
    </header>

    <main id="messages">
        <div class="empty-hint" id="empty-hint">
            <h2>👋 有什么可以帮你？</h2>
            <p>问问题、查天气、获取最新资讯，回答会逐字流式输出。</p>
            <div class="examples">
                <button onclick="useExample('今天是几号？')">今天是几号？</button>
                <button onclick="useExample('北京今天天气怎么样？')">北京天气</button>
                <button onclick="useExample('什么是 RAG？用三句话解释')">什么是 RAG</button>
                <button onclick="useExample('2024 年 AI 领域有哪些突破？')">最新 AI 进展</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="input-row">
            <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button id="send-btn">发送</button>
        </div>
    </footer>

    <script>
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const messagesEl = document.getElementById('messages');
        const emptyHint = document.getElementById('empty-hint');
        const resetBtn = document.getElementById('reset-btn');
        let sending = false;

        // 自适应高度的输入框
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        // Enter 发送
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        sendBtn.addEventListener('click', send);

        resetBtn.addEventListener('click', async () => {
            if (!confirm('确定清空对话记忆吗？')) return;
            try {
                await fetch('/reset', { method: 'POST' });
                messagesEl.innerHTML = '';
                messagesEl.appendChild(emptyHint);
                emptyHint.style.display = 'block';
            } catch (e) {
                alert('清空失败：' + e.message);
            }
        });

        function useExample(text) {
            inputEl.value = text;
            inputEl.focus();
            send();
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<div class="avatar">你</div><div class="bubble"></div>`;
            div.querySelector('.bubble').textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addAssistantBubble() {
            if (emptyHint.parentElement) emptyHint.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `<div class="avatar">AI</div><div class="bubble thinking"></div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
            return div.querySelector('.bubble');
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text || sending) return;
            sending = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addUserMessage(text);
            const bubble = addAssistantBubble();
            bubble.classList.remove('thinking');

            try {
                const url = '/chat?q=' + encodeURIComponent(text);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let firstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    // SSE 事件以 \n\n 分隔
                    const events = buffer.split('\n\n');
                    buffer = events.pop(); // 最后一段可能不完整，留到下次

                    for (const ev of events) {
                        const line = ev.trim();
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6);
                        try {
                            const obj = JSON.parse(payload);
                            if (obj.chunk) {
                                if (firstChunk) {
                                    bubble.classList.remove('thinking');
                                    firstChunk = false;
                                }
                                bubble.textContent += obj.chunk;
                                scrollToBottom();
                            } else if (obj.error) {
                                bubble.classList.add('error');
                                bubble.textContent = '⚠️ ' + obj.error;
                            } else if (obj.done) {
                                // 结束
                            }
                        } catch (e) {
                            console.error('parse error', e, payload);
                        }
                    }
                }
            } catch (e) {
                bubble.classList.add('error');
                bubble.textContent = '⚠️ 请求失败：' + e.message;
            } finally {
                sending = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        inputEl.focus();
    </script>
</body>
</html>
